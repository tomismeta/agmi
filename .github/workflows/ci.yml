name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.96.0 fmt --all -- --check
      - name: Native bridge syntax
        run: node --check adapters/openclaw.mjs
      - name: Native bridge contracts
        run: python3 tests/native_bridge_smoke.py
      - name: Behavior tests
        run: cargo +1.96.0 test --locked
      - name: Lints
        run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings
      - name: Build binary
        run: cargo +1.96.0 build --locked
      - name: CLI discovery
        run: ./target/debug/agmi commands --json
      - name: Lost-grade cold-restart safety
        run: python3 tests/recovery_smoke.py target/debug/agmi
      - name: Bound recovery and identifier rejection
        run: python3 tests/recovery_smoke.py target/debug/agmi --bound-job
      - name: Observation during stalled judging
        run: python3 tests/recovery_smoke.py target/debug/agmi --stalled-judge
      - name: Python-native recovery transport
        run: python3 tests/recovery_smoke.py target/debug/agmi --harness hermes --bound-job
      - name: Liveness during paged network work
        run: python3 tests/recovery_smoke.py target/debug/agmi --slow-inventory
      - name: Malformed identity fences effects
        run: python3 tests/recovery_smoke.py target/debug/agmi --bad-identity
      - name: Unanchored journal and authority integrity
        run: python3 tests/recovery_smoke.py target/debug/agmi --unanchored
      - name: Bounded participation and CLI policy reload
        run: python3 tests/participation_smoke.py target/debug/agmi
      - name: Urgent work and retained background progress
        run: python3 tests/work_first_smoke.py target/debug/agmi
      - name: Participation durability and diagnostic regressions
        run: python3 tests/runtime_reliability_smoke.py target/debug/agmi
      - name: Accepted-job polling and operational risk reporting
        run: python3 tests/queued_polling_smoke.py target/debug/agmi
      - name: Agent administration and startup identity fencing
        run: python3 tests/admin_smoke.py target/debug/agmi
      - name: Terminal stale-seed regeneration and attempt limits
        run: python3 tests/stale_seed_smoke.py target/debug/agmi
      - name: Credential onboarding rotation and terminal confidentiality
        run: python3 tests/lifecycle_smoke.py target/debug/agmi
      - name: Rust installer lifecycle and candidate integrity
        run: python3 tests/installer_smoke.py target/debug/agmi
      - name: Identity-read and historical-answer continuity
        run: python3 tests/continuity_smoke.py target/debug/agmi
      - name: Explicit registration durability and confidentiality
        run: python3 tests/registration_smoke.py target/debug/agmi
      - name: Configurable endpoint trust and durable routing
        run: python3 tests/endpoints_smoke.py target/debug/agmi
      - name: Isolated systemd release lifecycle
        run: |
          docker build -f tests/systemd_fixture.Dockerfile -t agmi-systemd-fixture tests
          name="agmi-systemd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --privileged --cgroupns=private \
            --network=none --tmpfs /run --tmpfs /run/lock --tmpfs /tmp:exec,mode=1777 \
            -v "$PWD:/src:ro" -v "$PWD/target/debug/agmi:/input/agmi:ro" \
            agmi-systemd-fixture
          timeout 60 docker exec "$name" sh -c \
            'until systemctl start user@17321.service; do sleep 1; done'
          docker exec "$name" runuser -u agmi-systemd-fixture -- env \
            HOME=/home/agmi-systemd-fixture XDG_RUNTIME_DIR=/run/user/17321 \
            DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/17321/bus \
            python3 /src/tests/installer_smoke.py /input/agmi --isolated-home
          docker exec "$name" runuser -u agmi-systemd-fixture -- env \
            HOME=/home/agmi-systemd-fixture XDG_RUNTIME_DIR=/run/user/17321 \
            DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/17321/bus \
            python3 /src/tests/systemd_smoke.py /input/agmi
      - name: Build identity
        run: ./target/debug/agmi build-info --manifest
      - name: Inspect distributable contents
        run: cargo +1.96.0 package --locked --list --allow-dirty
      - name: Install and exercise extracted package
        run: |
          cargo +1.96.0 package --locked --allow-dirty
          package_root="$RUNNER_TEMP/agmi-package"
          mkdir -p "$package_root"
          tar -xzf target/package/agmi-0.1.0.crate -C "$package_root"
          cargo +1.96.0 install --path "$package_root/agmi-0.1.0" --locked --root "$package_root/install"
          "$package_root/install/bin/agmi" build-info --manifest
          python3 tests/lifecycle_smoke.py "$package_root/install/bin/agmi" --scenario init
