name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rustsec:
    uses: ./.github/workflows/rustsec.yml

  rust:
    needs: rustsec
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.96.0 fmt --all -- --check
      - name: Native bridge syntax
        run: node --check adapters/openclaw.mjs
      - name: Native bridge contracts
        run: python3 tests/native_bridge_smoke.py
      - name: Standalone omp compatibility fixtures
        run: |
          omp_dir="$RUNNER_TEMP/agmi-omp"
          mkdir -p "$omp_dir"
          fetch_omp() {
            local version="$1" digest="$2" output="$omp_dir/omp-$1"
            curl --fail --silent --show-error --location \
              "https://github.com/can1357/oh-my-pi/releases/download/v$version/omp-linux-x64" \
              --output "$output"
            printf '%s  %s\n' "$digest" "$output" | sha256sum --check
            chmod 0755 "$output"
          }
          # Reproducible test inputs, not runtime version requirements.
          fetch_omp 18.22.2 80a692c5adb9c71124bb11e77bd7edb3cf8fbbab6980db3206dcb6a4cb2905b5
          fetch_omp 19.0.1 6ceef04430851bb1050c6fda3af467412eb44a11df0a6ff8121fe601013c5415
          fetch_omp 19.1.0 be2b45c437b623e15c29b1f8c98aacb842f92118196454b5e9eed884359e9a01
          python3 tests/omp_native_smoke.py --omp "$omp_dir/omp-19.0.1"
      - name: Behavior tests
        run: RUST_BACKTRACE=1 cargo +1.96.0 test --locked
      - name: Isolated rootless OMP sandbox regression
        run: |
          docker build -f tests/systemd_fixture.Dockerfile -t agmi-systemd-fixture tests
          sandbox_test=$(
            cargo +1.96.0 test --locked --lib --no-run --message-format=json \
              | jq -er 'select(.reason=="compiler-artifact" and .target.name=="agmi" and (.target.kind|index("lib")) and .profile.test and .executable!=null)|.executable'
          )
          security=()
          if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" == 1 ]]; then
            # Allow nested user namespaces only in the isolated test container.
            # Keep the Ubuntu runner's AppArmor sysctl and host policy unchanged.
            profile="$RUNNER_TEMP/agmi-ci-omp-userns"
            cat >"$profile" <<'APPARMOR'
          abi <abi/4.0>,
          profile agmi-ci-omp-userns flags=(unconfined) {
              userns,
          }
          APPARMOR
            sudo apparmor_parser -r "$profile"
            security=(--security-opt apparmor=agmi-ci-omp-userns)
            echo 'AGMI_CI_OMP_APPARMOR=apparmor=agmi-ci-omp-userns' >> "$GITHUB_ENV"
          fi
          docker run --rm --privileged --cgroupns=private --network=none "${security[@]}" \
            --tmpfs /tmp:exec,mode=1777 -v "$sandbox_test:/input/agmi-sandbox-test:ro" \
            --entrypoint runuser agmi-systemd-fixture -u agmi-systemd-fixture -- setpriv --no-new-privs \
            /input/agmi-sandbox-test --exact \
            solver::omp::qualification::tests::isolated_probe_closes_host_descriptors_and_stops_with_parent \
            --ignored --test-threads=1
      - name: Lints
        run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings
      - name: Build authentic format-4 rollback fixture
        timeout-minutes: 8
        run: |
          baseline=55fd89710edf4ccacc968a5f2662eac5a11a6704
          root="$RUNNER_TEMP/agmi-rollback"
          mkdir -p "$root/source"
          git archive "$baseline" | tar -x -C "$root/source"
          printf '{"git":{"sha1":"%s"}}\n' "$baseline" > "$root/source/.cargo_vcs_info.json"
          # Share already built native dependencies; the next step restores
          # target/debug/agmi to the candidate build before any smoke tests.
          cargo +1.96.0 build --locked --manifest-path "$root/source/Cargo.toml" \
            --target-dir "$PWD/target" --bin agmi
          install -m 0755 target/debug/agmi "$root/agmi"
          "$root/agmi" build-info --manifest | grep -Fx "commit=$baseline"
          digest=$(sha256sum "$root/agmi" | cut -d ' ' -f 1)
          printf 'AGMI_ROLLBACK_BINARY=%s\nAGMI_ROLLBACK_SHA256=%s\n' "$root/agmi" "$digest" >> "$GITHUB_ENV"
      - name: Build binary
        run: cargo +1.96.0 build --locked
      - name: Install pinned Linux release tools
        run: |
          rustup target add --toolchain 1.96.0 x86_64-unknown-linux-musl
          cargo +1.96.0 install cargo-zigbuild --version 0.24.1 --locked
          zig_dir=$(mktemp -d "$RUNNER_TEMP/agmi-zig.XXXXXXXX")
          curl --fail --silent --show-error --location --proto '=https' \
            https://ziglang.org/download/index.json --output "$zig_dir/index.json"
          zig_url=$(jq --exit-status --raw-output '.["0.17.1"]["x86_64-linux"].tarball' "$zig_dir/index.json")
          zig_sha=$(jq --exit-status --raw-output '.["0.17.1"]["x86_64-linux"].shasum' "$zig_dir/index.json")
          [[ "$zig_url" = https://ziglang.org/download/0.17.1/* ]]
          [[ "$zig_sha" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --silent --show-error --location --proto '=https' \
            "$zig_url" --output "$zig_dir/zig.tar.xz"
          printf '%s  %s\n' "$zig_sha" "$zig_dir/zig.tar.xz" | sha256sum --strict --check
          tar -xJf "$zig_dir/zig.tar.xz" --strip-components=1 -C "$zig_dir"
          printf '%s\n' "$zig_dir" >> "$GITHUB_PATH"

          llvm_key="$RUNNER_TEMP/agmi-llvm.asc"
          curl --fail --silent --show-error --location --proto '=https' \
            https://apt.llvm.org/llvm-snapshot.gpg.key --output "$llvm_key"
          fingerprint=$(gpg --batch --show-keys --with-colons "$llvm_key" \
            | awk -F: '$1 == "pub" { primary=1; next } $1 == "fpr" && primary { print $10; primary=0 }')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$llvm_key" /usr/share/keyrings/agmi-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/agmi-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' \
            | sudo tee /etc/apt/sources.list.d/agmi-llvm.list
          sudo apt-get update -o Dir::Etc::sourcelist=sources.list.d/agmi-llvm.list -o Dir::Etc::sourceparts=-
          llvm_version=$(apt-cache madison clang-22 \
            | awk '$3 ~ /^(1:)?22\.1\.8([~+.-]|$)/ && $5 ~ /^https:\/\/apt\.llvm\.org\// { print $3; exit }')
          test -n "$llvm_version"
          sudo apt-get install -y --no-install-recommends \
            "clang-22=$llvm_version" "lld-22=$llvm_version" "llvm-22=$llvm_version"
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - name: Build Linux x64 musl release
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/agmi-linux-musl
        run: bash tools/build-linux-musl.sh
      - name: Stage and verify updater-selected assets
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/agmi-linux-musl
        run: |
          target=x86_64-unknown-linux-musl
          binary="$CARGO_TARGET_DIR/$target/release/agmi"
          root="$RUNNER_TEMP/agmi-release"
          mkdir -p "$root"/{stage,assets,extracted,evidence}
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="agmi-v$version-$target.tar.gz"
          dependency_sources="agmi-$version-third-party-sources"
          mkdir "$root/$dependency_sources"
          cp Cargo.lock "$root/$dependency_sources/"
          cargo +1.96.0 vendor --locked --versioned-dirs "$root/$dependency_sources/vendor"
          sysroot=$(rustup run 1.96.0 rustc --print sysroot)
          python3 tools/release-notices.py "$root/$dependency_sources" \
            "$sysroot/share/doc/rust/COPYRIGHT-library.html" "$version"
          cp "$root/$dependency_sources/THIRD_PARTY.md" "$root/stage/"
          cp -R "$root/$dependency_sources/third-party-licenses" "$root/stage/"
          tar -C "$root" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - "$dependency_sources" | gzip -n > "$root/assets/$dependency_sources.tar.gz"
          install -m 0755 "$binary" "$root/stage/agmi"
          embedded="$root/embedded-build-info.txt"
          "$root/stage/agmi" build-info --manifest > "$embedded"
          manifest="$root/assets/BUILD-INFO.txt"
          digest=$(sha256sum "$root/stage/agmi" | cut -d ' ' -f 1)
          { cat "$embedded"; printf 'binary_sha256=%s\n' "$digest"; } > "$manifest"
          grep -Fx "binary_sha256=$digest" "$manifest"
          grep -Fx "package_version=$version" "$manifest"
          grep -Fx "commit=$(git rev-parse HEAD)" "$manifest"
          grep -Fx 'source_dirty=clean' "$manifest"
          grep -Fx "target=$target" "$manifest"
          grep -Fx 'profile=release' "$manifest"
          grep -Fx 'build_format=1' "$manifest"
          grep -Fx 'update_protocol=1' "$manifest"
          provenance="$CARGO_TARGET_DIR/agmi-linux-musl-provenance.txt"
          grep -Fx "binary_sha256=$digest" "$provenance"
          cp "$provenance" "$root/evidence/ALLOCATOR-PROVENANCE.txt"
          gzip -n -c "$CARGO_TARGET_DIR/agmi-linux-musl.map" > "$root/evidence/LINK-MAP.txt.gz"
          install -m 0644 "$manifest" "$root/stage/BUILD-INFO.txt"
          install -m 0644 LICENSE "$root/stage/LICENSE"
          tar -C "$root/stage" --sort=name --format=ustar --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - agmi BUILD-INFO.txt LICENSE THIRD_PARTY.md third-party-licenses \
            | gzip -n > "$root/assets/$archive"
          (
            cd "$root/assets"
            sha256sum BUILD-INFO.txt "$archive" "$dependency_sources.tar.gz" > SHA256SUMS
            sha256sum --strict --check SHA256SUMS
          )
          tar -xzf "$root/assets/$archive" -C "$root/extracted"
          cmp "$manifest" "$root/extracted/BUILD-INFO.txt"
          cmp "$root/stage/THIRD_PARTY.md" "$root/extracted/THIRD_PARTY.md"
          diff -qr "$root/stage/third-party-licenses" "$root/extracted/third-party-licenses"
          printf '%s  %s\n' "$digest" "$root/extracted/agmi" | sha256sum --strict --check
          "$root/extracted/agmi" build-info --manifest | cmp "$embedded" -
          "$root/extracted/agmi" build-info --installer-capabilities \
            | cmp - <(printf 'bound_dispute_fence=1\n')
          AGMI_UPDATE_TEST_ASSETS="$root/assets" CARGO_TARGET_DIR="$PWD/target" \
            cargo +1.96.0 test --locked --lib \
            update::tests::staged_release_passes_protocol_one_updater_verification -- --exact --ignored
          printf 'AGMI_PACKAGED_MUSL=%s\n' "$root/extracted/agmi" >> "$GITHUB_ENV"
      - name: Isolated stock OMP qualification of exact package
        run: |
          security=()
          if [[ -n "${AGMI_CI_OMP_APPARMOR:-}" ]]; then
            security=(--security-opt "$AGMI_CI_OMP_APPARMOR")
          fi
          docker run --rm --privileged --cgroupns=private --network=none "${security[@]}" \
            --tmpfs /tmp:exec,mode=1777 -v "$PWD/tests:/tests:ro" \
            -v "$AGMI_PACKAGED_MUSL:/input/agmi:ro" \
            -v "$RUNNER_TEMP/agmi-omp/omp-19.1.0:/input/omp:ro" \
            --entrypoint /bin/sh agmi-systemd-fixture -ec '
              for model in glm-5.3 kimi-k3; do
                runuser -u agmi-systemd-fixture -- setpriv --no-new-privs \
                  python3 -u /tests/omp_go_qualification_smoke.py /input/agmi \
                    --omp /input/omp --stock-gate --model "$model"
              done
            '
      - name: CLI discovery
        run: ./target/debug/agmi commands --json
      - name: Lost-grade cold-restart safety
        run: python3 tests/recovery_smoke.py target/debug/agmi
      - name: Bound recovery and identifier rejection
        run: python3 tests/recovery_smoke.py target/debug/agmi --bound-job
      - name: Observation during stalled judging
        run: python3 tests/recovery_smoke.py target/debug/agmi --stalled-judge
      - name: Python-native recovery transport
        run: python3 tests/recovery_smoke.py target/debug/agmi --harness hermes --bound-job
      - name: Liveness during paged network work
        run: python3 tests/recovery_smoke.py target/debug/agmi --slow-inventory
      - name: Malformed identity fences effects
        run: python3 tests/recovery_smoke.py target/debug/agmi --bad-identity
      - name: Unanchored journal and authority integrity
        run: python3 tests/recovery_smoke.py target/debug/agmi --unanchored
      - name: Bounded participation and CLI policy reload
        run: python3 tests/participation_smoke.py target/debug/agmi
      - name: Urgent work and retained background progress
        run: python3 tests/work_first_smoke.py target/debug/agmi
      - name: Participation durability and diagnostic regressions
        run: python3 tests/runtime_reliability_smoke.py target/debug/agmi
      - name: Accepted-job polling and operational risk reporting
        run: python3 tests/queued_polling_smoke.py target/debug/agmi
      - name: Agent administration and startup identity fencing
        run: python3 tests/admin_smoke.py target/debug/agmi
      - name: Terminal stale-seed regeneration and attempt limits
        run: python3 tests/stale_seed_smoke.py target/debug/agmi
      - name: Credential onboarding rotation and terminal confidentiality
        run: python3 tests/lifecycle_smoke.py target/debug/agmi
      - name: Rust installer lifecycle and candidate integrity
        run: python3 tests/installer_smoke.py target/debug/agmi
      - name: Identity-read and historical-answer continuity
        run: python3 tests/continuity_smoke.py target/debug/agmi
      - name: Writer and account authority continuity
        run: python3 tests/writer_continuity_smoke.py target/debug/agmi
      - name: Explicit registration durability and confidentiality
        run: python3 tests/registration_smoke.py target/debug/agmi
      - name: Configurable endpoint trust and durable routing
        run: python3 tests/endpoints_smoke.py target/debug/agmi
      - name: Build identity
        run: ./target/debug/agmi build-info --manifest
      - name: Registry publish credential boundary
        run: RUSTUP_TOOLCHAIN=1.96.0 python3 tests/crates_io_credential_smoke.py
      - name: Inspect distributable contents
        run: cargo +1.96.0 package --locked --list
      - name: Install and exercise extracted package
        run: |
          cargo +1.96.0 publish --locked --registry crates-io --dry-run --no-verify
          cargo +1.96.0 package --locked --registry crates-io
          package_root="$RUNNER_TEMP/agmi-package"
          mkdir -p "$package_root"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          install -m 0644 "target/package/agmi-$version.crate" "$RUNNER_TEMP/agmi-release/assets/"
          tar -xzf "target/package/agmi-$version.crate" -C "$package_root"
          cargo +1.96.0 test --manifest-path "$package_root/agmi-$version/Cargo.toml" --locked --lib --no-run
          RUSTDOCFLAGS="-D warnings" cargo +1.96.0 doc --locked --lib --no-deps \
            --manifest-path "$package_root/agmi-$version/Cargo.toml" --target-dir "$PWD/target"
          cargo +1.96.0 install --path "$package_root/agmi-$version" --locked --root "$package_root/install"
          manifest="$package_root/BUILD-INFO.txt"
          "$package_root/install/bin/agmi" build-info --manifest | tee "$manifest"
          grep -Fx "package_version=$version" "$manifest"
          grep -Fx "commit=$(git rev-parse HEAD)" "$manifest"
          grep -Fx 'source_dirty=clean' "$manifest"
          python3 tests/lifecycle_smoke.py "$package_root/install/bin/agmi" --scenario init
          python3 tests/lifecycle_smoke.py "$package_root/install/bin/agmi" --scenario prompt
      - name: Build fixture-only OpenCode Go controller
        run: |
          cargo +1.96.0 build --locked --bin agmi --features omp-go-fixture \
            --target-dir "$RUNNER_TEMP/agmi-omp-go-fixture"
      - name: Test exact packaged adapters and separately built OpenCode Go fixture
        run: |
          docker run --rm --init --network=none --tmpfs /tmp:exec,mode=1777 \
            -v "$PWD/tests:/tests:ro" \
            -v "$RUNNER_TEMP/agmi-package/install/bin/agmi:/input/agmi-source:ro" \
            -v "$AGMI_PACKAGED_MUSL:/input/agmi:ro" \
            -v "$RUNNER_TEMP/agmi-omp:/input/omp:ro" \
            -v "$RUNNER_TEMP/agmi-omp-go-fixture/debug/agmi:/input/agmi-go-fixture:ro" \
            --entrypoint /bin/sh agmi-systemd-fixture -ec '
              runuser -u agmi-systemd-fixture -- \
                python3 -u /tests/packaged_omp_smoke.py /input/agmi-source --omp /input/omp/omp-19.0.1
              runuser -u agmi-systemd-fixture -- \
                python3 -u /tests/packaged_omp_smoke.py /input/agmi --omp /input/omp/omp-19.0.1
              # Exact distributed binaries must reject a valid custom overlay even with the old switch set.
              for binary in /input/agmi-source /input/agmi; do
                runuser -u agmi-systemd-fixture -- \
                  python3 -u /tests/omp_go_qualification_smoke.py "$binary" \
                    --omp /input/omp/omp-19.0.1 --expect-production-refusal
              done
              # Only this separate, non-distributed controller may dispatch synthetic hosted work.
              for version in 18.22.2 19.0.1; do
                runuser -u agmi-systemd-fixture -- \
                  python3 -u /tests/omp_go_qualification_smoke.py /input/agmi-go-fixture --omp "/input/omp/omp-$version"
              done
              for model in glm-5.3 kimi-k3; do
                runuser -u agmi-systemd-fixture -- \
                  python3 -u /tests/omp_go_qualification_smoke.py /input/agmi-go-fixture \
                    --omp /input/omp/omp-19.1.0 --judge-only --model "$model"
              done
              runuser -u agmi-systemd-fixture -- \
                python3 -u /tests/lifecycle_smoke.py /input/agmi --scenario init
              runuser -u agmi-systemd-fixture -- \
                python3 -u /tests/lifecycle_smoke.py /input/agmi --scenario prompt
            '
      - name: Isolated systemd release lifecycle
        run: |
          # Consume the extracted, verified archive bytes, never a rebuild.
          name="agmi-systemd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --privileged --cgroupns=private \
            --network=none --tmpfs /run --tmpfs /run/lock --tmpfs /tmp:exec,mode=1777 \
            -v "$PWD:/src:ro" -v "$AGMI_PACKAGED_MUSL:/input/agmi:ro" \
            agmi-systemd-fixture
          timeout 60 docker exec "$name" sh -c \
            'until systemctl start user@17321.service; do sleep 1; done'
          docker exec "$name" runuser -u agmi-systemd-fixture -- env \
            HOME=/home/agmi-systemd-fixture XDG_RUNTIME_DIR=/run/user/17321 \
            DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/17321/bus \
            python3 -u /src/tests/installer_smoke.py /input/agmi --isolated-home
          docker exec "$name" runuser -u agmi-systemd-fixture -- env \
            HOME=/home/agmi-systemd-fixture XDG_RUNTIME_DIR=/run/user/17321 \
            DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/17321/bus \
            python3 -u /src/tests/systemd_smoke.py /input/agmi
      - name: Isolated systemd retained writer and managed health outcomes
        timeout-minutes: 8
        run: |
          for suite in retained-rollback managed-health; do
            name="agmi-$suite-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
            docker run -d --name "$name" --privileged --cgroupns=private \
              --network=none --tmpfs /run --tmpfs /run/lock --tmpfs /tmp:exec,mode=1777 \
              -v "$PWD:/src:ro" -v "$AGMI_PACKAGED_MUSL:/input/agmi:ro" \
              -v "$AGMI_ROLLBACK_BINARY:/input/agmi-old:ro" agmi-systemd-fixture
            timeout 60 docker exec "$name" sh -c \
              'until systemctl start user@17321.service; do sleep 1; done'
            timeout 180 docker exec "$name" runuser -u agmi-systemd-fixture -- env \
              HOME=/home/agmi-systemd-fixture XDG_RUNTIME_DIR=/run/user/17321 \
              DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/17321/bus \
              python3 -u /src/tests/systemd_smoke.py /input/agmi --suite "$suite" \
              --old-binary /input/agmi-old --old-sha256 "$AGMI_ROLLBACK_SHA256"
            docker rm -f "$name"
            trap - EXIT
          done
      - name: Isolated model workspace recovery
        run: |
          name="agmi-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --privileged --cgroupns=private \
            --network=none --tmpfs /run --tmpfs /run/lock --tmpfs /tmp:exec,mode=1777 \
            -v "$PWD:/src:ro" -v "$AGMI_PACKAGED_MUSL:/input/agmi:ro" \
            agmi-systemd-fixture
          docker exec "$name" python3 -u /src/tests/storage_runtime_smoke.py /input/agmi
      - name: Recheck qualified release bytes
        run: |
          cd "$RUNNER_TEMP/agmi-release/assets"
          version=$(awk -F= '$1 == "package_version" { print $2 }' BUILD-INFO.txt)
          sha256sum -- "agmi-$version.crate" >> SHA256SUMS
          sha256sum --strict --check SHA256SUMS
          digest=$(awk -F= '$1 == "binary_sha256" { print $2 }' BUILD-INFO.txt)
          printf '%s  %s\n' "$digest" "$AGMI_PACKAGED_MUSL" | sha256sum --strict --check
      - name: Upload qualified Linux x64 candidate and link evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agmi-linux-x64-qualified
          path: |
            ${{ runner.temp }}/agmi-release/assets/
            ${{ runner.temp }}/agmi-release/evidence/
          if-no-files-found: error
          compression-level: 0
