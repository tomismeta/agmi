name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.96.0 fmt --all -- --check
      - name: Native bridge syntax
        run: node --check adapters/openclaw.mjs
      - name: Installer syntax
        run: sh -n deploy/install-user.sh
      - name: Behavior tests
        run: cargo +1.96.0 test --locked
      - name: Lints
        run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings
      - name: Build binary
        run: cargo +1.96.0 build --locked
      - name: CLI discovery
        run: ./target/debug/agmi commands --json
      - name: Lost-grade cold-restart safety
        run: python3 tests/recovery_smoke.py target/debug/agmi
      - name: Bound recovery and identifier rejection
        run: python3 tests/recovery_smoke.py target/debug/agmi --bound-job
      - name: Observation during stalled judging
        run: python3 tests/recovery_smoke.py target/debug/agmi --stalled-judge
      - name: Python-native recovery transport
        run: python3 tests/recovery_smoke.py target/debug/agmi --harness hermes --bound-job
      - name: Liveness during paged network work
        run: python3 tests/recovery_smoke.py target/debug/agmi --slow-inventory
      - name: Malformed identity fences effects
        run: python3 tests/recovery_smoke.py target/debug/agmi --bad-identity
      - name: Unanchored journal and authority integrity
        run: python3 tests/recovery_smoke.py target/debug/agmi --unanchored
      - name: Bounded participation and CLI policy reload
        run: python3 tests/participation_smoke.py target/debug/agmi
      - name: Urgent work and retained background progress
        run: python3 tests/work_first_smoke.py target/debug/agmi
      - name: Accepted-job polling and operational risk reporting
        run: python3 tests/queued_polling_smoke.py target/debug/agmi
      - name: Agent administration and startup identity fencing
        run: python3 tests/admin_smoke.py target/debug/agmi
      - name: Terminal stale-seed regeneration and attempt limits
        run: python3 tests/stale_seed_smoke.py target/debug/agmi
      - name: Credential onboarding rotation and terminal confidentiality
        run: python3 tests/lifecycle_smoke.py target/debug/agmi
      - name: Installer candidate replacement fence
        run: python3 tests/installer_smoke.py target/debug/agmi
      - name: Build identity
        run: ./target/debug/agmi build-info --manifest
      - name: Inspect distributable contents
        run: cargo +1.96.0 package --locked --list --allow-dirty
