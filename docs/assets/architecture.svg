<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">agmi architecture at a glance</title>
  <desc id="desc">Operator policy and guidance enter one local agmi runtime with three equal lanes: answer and judge, which obtain content only from the existing authenticated Hermes or OpenClaw native harness, and mine, which is model-free. Only agmi submits, through a shared local submission gate, to the external MinePOA network; local write serialization is not upstream exclusivity. Observations and receipts return on a read path that bypasses the write gate. A durable local SQLite journal using WAL and FULL synchronization records intent and outcomes. The harness has no connection to the network.</desc>
  <style>
    :root{
      color-scheme: light dark;
      --_fg: var(--fg, #171a1f);
      --_muted: var(--muted, #5b6472);
      --_border: var(--border, #c6ccd6);
      --_surface: var(--surface, #f4f6f8);
      --_accent: var(--accent, #0f766e);
      --_c1: var(--c1, #7c5cd6);
      --_c2: var(--c2, #2563eb);
      --_c3: var(--c3, #b45309);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --_fg: var(--fg, #edf0f5);
        --_muted: var(--muted, #a7b0bf);
        --_border: var(--border, #454f60);
        --_surface: var(--surface, #171b22);
        --_accent: var(--accent, #2dd4bf);
        --_c1: var(--c1, #b7a6f5);
        --_c2: var(--c2, #8db4f7);
        --_c3: var(--c3, #f2b26b);
      }
    }
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;}
    .fg{fill:var(--_fg);} .mu{fill:var(--_muted);} .ac{fill:var(--_accent);}
    .sf{fill:var(--_surface);} .nf{fill:none;}
    .bs{stroke:var(--_border);} .as{stroke:var(--_accent);} .ms{stroke:var(--_muted);}
    .s1{stroke:var(--_c1);} .s2{stroke:var(--_c2);} .s3{stroke:var(--_c3);}
  </style>
  <defs>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" style="fill:var(--_accent)"/>
    </marker>
    <marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" style="fill:var(--_muted)"/>
    </marker>
  </defs>

  <!-- header -->
  <text x="20" y="30" class="mono ac" font-size="18" font-weight="700" letter-spacing="2">// AGMI ARCHITECTURE</text>
  <line x1="20" y1="44" x2="940" y2="44" class="bs" stroke-width="1"/>

  <!-- local boundary (drawn first; connectors follow) -->
  <rect x="20" y="58" width="730" height="342" rx="10" class="nf bs" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="38" y="84" class="mono ac" font-size="14" font-weight="700" letter-spacing="1.8">LOCAL</text>
  <text x="790" y="84" class="mono mu" font-size="14" font-weight="700" letter-spacing="1.8">EXTERNAL</text>

  <!-- operator -->
  <rect x="38" y="188" width="150" height="84" rx="6" class="sf bs" stroke-width="1"/>
  <text x="113" y="222" class="fg" font-size="18" font-weight="700" text-anchor="middle">Operator</text>
  <text x="113" y="248" class="mu" font-size="14" text-anchor="middle">Policy + guidance</text>

  <!-- agmi runtime -->
  <rect x="216" y="78" width="330" height="240" rx="8" class="sf as" stroke-width="1.3"/>
  <g class="nf as" stroke-width="1.6">
    <path d="M210 102 V72 H234"/>
    <path d="M528 72 H552 V102"/>
    <path d="M210 294 V324 H234"/>
    <path d="M528 324 H552 V294"/>
  </g>
  <text x="234" y="106" class="mono fg" font-size="19" font-weight="700" letter-spacing="1">AGMI RUNTIME</text>

  <!-- lanes: identical geometry, equal weight -->
  <rect x="234" y="116" width="294" height="42" rx="4" class="nf bs" stroke-width="1"/>
  <line x1="237" y1="121" x2="237" y2="153" class="s1" stroke-width="3"/>
  <text x="252" y="144" class="fg" font-size="18" font-weight="700">Answer</text>

  <rect x="234" y="164" width="294" height="42" rx="4" class="nf bs" stroke-width="1"/>
  <line x1="237" y1="169" x2="237" y2="201" class="s2" stroke-width="3"/>
  <text x="252" y="192" class="fg" font-size="18" font-weight="700">Judge</text>

  <rect x="234" y="212" width="294" height="42" rx="4" class="nf bs" stroke-width="1"/>
  <line x1="237" y1="217" x2="237" y2="249" class="s3" stroke-width="3"/>
  <text x="252" y="240" class="fg" font-size="18" font-weight="700">Mine · no model</text>

  <!-- the single shared local submission gate -->
  <rect x="234" y="262" width="294" height="42" rx="4" class="nf as" stroke-width="1.2"/>
  <text x="381" y="290" class="ac" font-size="18" font-weight="700" text-anchor="middle">Submission gate</text>

  <!-- journal -->
  <rect x="216" y="332" width="330" height="52" rx="6" class="sf bs" stroke-width="1"/>
  <text x="234" y="365" class="fg" font-size="18" font-weight="700">SQLite journal</text>
  <text x="528" y="365" class="mu" font-size="14" text-anchor="end">WAL + FULL</text>

  <!-- native harness client: linked to Answer/Judge only -->
  <rect x="580" y="88" width="156" height="110" rx="6" class="sf bs" stroke-width="1"/>
  <text x="658" y="118" class="fg" font-size="18" font-weight="700" text-anchor="middle">Hermes /</text>
  <text x="658" y="142" class="fg" font-size="18" font-weight="700" text-anchor="middle">OpenClaw</text>
  <text x="658" y="172" class="mu" font-size="14" text-anchor="middle">Native harness</text>

  <!-- MinePOA: outside the local boundary -->
  <rect x="790" y="188" width="146" height="106" rx="6" class="sf bs" stroke-width="1"/>
  <text x="863" y="232" class="fg" font-size="19" font-weight="700" text-anchor="middle">MinePOA</text>
  <text x="863" y="258" class="mu" font-size="14" text-anchor="middle">Network</text>

  <!-- connectors: whitespace lanes only -->
  <!-- operator supplies policy + guidance -->
  <line x1="189" y1="230" x2="212" y2="230" class="ms" stroke-width="1.4" marker-end="url(#arM)"/>

  <!-- Answer/Judge <-> harness; Mine has no such link -->
  <line x1="547" y1="137" x2="576" y2="137" class="ms" stroke-width="1.4" marker-end="url(#arM)"/>
  <line x1="576" y1="185" x2="547" y2="185" class="ms" stroke-width="1.4" marker-end="url(#arM)"/>

  <!-- runtime records in its journal -->
  <line x1="381" y1="319" x2="381" y2="328" class="ms" stroke-width="1.4" marker-end="url(#arM)"/>

  <!-- observations bypass the submission gate -->
  <text x="668" y="222" class="mu" font-size="14" text-anchor="middle">observations</text>
  <line x1="788" y1="233" x2="550" y2="233" class="ms" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arM)"/>

  <!-- the only submission path: gate -> MinePOA -->
  <line x1="547" y1="283" x2="786" y2="283" class="as" stroke-width="1.7" marker-end="url(#arA)"/>
</svg>
