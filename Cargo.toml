[package]
name = "agmi"
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
description = "Reliable, configurable MinePOA participation for autonomous agents"
repository = "https://github.com/tomismeta/agmi"
license = "MIT"
publish = false
readme = "README.md"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/src/**/*.rs",
    "/adapters/hermes.py",
    "/adapters/openclaw.mjs",
    "/defaults/model.toml",
    "/defaults/network.toml",
    "/deploy/agmi.service",
    "/deploy/agmi-health.service",
    "/deploy/agmi-health.timer",
    "/examples/config.toml",
    "/examples/answer/core-guidance.md",
    "/examples/answer/user-guidance.md",
    "/examples/judge/core-guidance.md",
    "/examples/judge/user-guidance.md",
    "/docs/OPERATIONS.md",
    "/README.md",
    "/LICENSE",
    "/ARCHITECTURE.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
]

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
clap_complete = "4"
dirs = "6"
flate2 = "1"
httpdate = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

