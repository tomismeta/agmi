[package]
name = "agmi"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Reliable, configurable MinePOA participation for autonomous agents"
publish = false
readme = "README.md"
include = ["/Cargo.toml", "/Cargo.lock", "/build.rs", "/src/**", "/adapters/**", "/defaults/**", "/docs/**", "/README.md", "/ARCHITECTURE.md", "/CHANGELOG.md", "/SECURITY.md", "/examples/**", "/deploy/**"]

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
dirs = "6"
httpdate = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
