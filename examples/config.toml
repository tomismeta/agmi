# Copy outside the repository. Keep account credentials in a separate private file.
# Paths are relative to this configuration file, except bare executables use PATH.
state_dir = "./agmi-state"
# Known assignment IDs to exclude from new judging work; root-level, before tables.
excluded_judging_assignments = []

[network]
base_url = "https://minepoa.com"
chain = "poa-mainnet-1"
# Adding trust explicitly authorizes credential delivery to that origin.
trusted_origins = ["https://minepoa.com"]
address = ""
credential_file = ""

# Shipped defaults live in defaults/network.toml. Overrides are typed relative
# paths; methods/auth/effect permissions cannot be changed by route configuration.
# Changing a profile requires stopped/drained state (no prepared/unresolved work).
[network.api]
chain_path = "/chain/{chain}"
status = "/api/status"
networks = "/api/networks"
network_facts = "/api/network-facts"
epochs = "/api/epochs"
identity = "/api/hosted/me"
challenge = "/api/hosted/challenge"
assignments = "/api/hosted/assignments"
address_assignments = "/api/assignments/{address}"
explorer_address = "/api/explorer/address/{address}"
established = "/api/established/{address}"
job = "/api/job/{id}"
receipt = "/api/receipt/{id}"
explorer_tx = "/api/explorer/tx/{id}"
answer = "/api/hosted/answer"
grade = "/api/hosted/grade"
mine = "/api/hosted/mine"
join_pow = "/api/join-pow"
register = "/api/hosted/register"

[capabilities]
answer = "read_only"
judge = "read_only"
mine = "read_only"

# Off stops new participation, not safety reads for already possibly-sent work.
[preparation]
answer_while_blocked = true
# May repeat remote inference at additional cost; never retries a network write.
retry_uncertain = false
max_attempts_per_work = 1

# Strict is the default. Other modes accept bounded remote conflict risk;
# elapsed time never proves an uncertain request failed.
[participation]
mode = "strict" # strict | participation_first | manual
uncertainty_grace_seconds = 300
max_unresolved_operations = 4
# Participation-first capacity only; retains the original unknown plus witness.
# Requires a linked later accepted same-epoch answer; never claims settlement.
max_historical_unknown_answers = 0
# Reserve unresolved capacity for answers even after this epoch's answer completes.
# Must be smaller than max_unresolved_operations; zero preserves existing policy.
answer_reserved_slots = 0
allow_answer = true
allow_mine = true
allow_judge = false
# Separate opt-in: may repeat an already accepted answer.
retry_uncertain_answers = false
uncertain_answer_retry_seconds = 600
max_answer_attempts_per_epoch = 2

[solver.answer]
harness = "hermes"
executable = "hermes"
model = "gpt-6.1-sol"
reasoning = "high"
# Required nonempty core instructions for active routes. Copy the answer/judge
# directories beside this config; each layer is limited to 64 KiB and hot reloads.
core_guidance_file = "answer/core-guidance.md"
# Optional user preferences, subordinate to core instructions and output/security.
guidance_file = "answer/user-guidance.md"

[solver.judge]
harness = "hermes"
executable = "hermes"
model = "gpt-6.1-sol"
reasoning = "high"
core_guidance_file = "judge/core-guidance.md"
guidance_file = "judge/user-guidance.md"
# Admin discovery: agmi config schema; guidance show/set --layer core|user.
# Omitted --layer selects user. Both layers are captured per model attempt.
# Missing/empty configured core files fail loading; no built-in prose fallback.

[timeouts]
http_seconds = 30
# Optional read-only HTTP deadline; absent means http_seconds.
# Effectful mine GET requests always use http_seconds.
# read_http_seconds = 60
model_seconds = 300
shutdown_seconds = 30

[schedule]
poll_seconds = 120
mine_seconds = 86400
# Replaces the interval with one dispatched mine per freshly observed epoch.
mine_each_epoch = false
retry_seconds = 180
# Caps exponential read backoff; base/server minimum wins, then jitter is added.
backoff_max_seconds = 900
# Optional challenge-only overrides; omitted fields inherit the generic values.
# Hot changes never shorten retained server minima.
# challenge_retry_seconds = 30
# challenge_backoff_max_seconds = 120
# Optional assignment-only overrides; null/inherit in JSON, omitted in TOML.
# assignments_retry_seconds = 180
# assignments_backoff_max_seconds = 900
# Deterministic per-identity startup/poll/retry staggering; 0 disables staggering.
jitter_seconds = 30

# Optional accepted-job polling, independent of error retries and receipt cadence.
# Both positive fields required. Omit the table to retain the existing cadence.
# The local cap includes jitter; server minima and read backoff still win.
# [schedule.queued_job_polling]
# initial_seconds = 15
# max_seconds = 120
