# Copy outside the repository. Keep account credentials in a separate private file.
# Paths are relative to this configuration file, except bare executables use PATH.
schema_version = 2
state_dir = "./agmi-state"

[network]
base_url = "https://minepoa.com"
chain = "poa-mainnet-1"
# Adding trust explicitly authorizes credential delivery to that origin.
trusted_origins = ["https://minepoa.com"]
address = ""
credential_file = ""

# Shipped defaults live in defaults/network.toml. Overrides are typed relative
# paths; methods/auth/effect permissions cannot be changed by route configuration.
# Changing a profile requires stopped/drained state (no prepared/unresolved work).
[network.api]
chain_path = "/chain/{chain}"
status = "/api/status"
networks = "/api/networks"
network_facts = "/api/network-facts"
epochs = "/api/epochs"
identity = "/api/hosted/me"
challenge = "/api/hosted/challenge"
assignments = "/api/hosted/assignments"
address_assignments = "/api/assignments/{address}"
explorer_address = "/api/explorer/address/{address}"
established = "/api/established/{address}"
job = "/api/job/{id}"
receipt = "/api/receipt/{id}"
explorer_tx = "/api/explorer/tx/{id}"
answer = "/api/hosted/answer"
grade = "/api/hosted/grade"
mine = "/api/hosted/mine"
join_pow = "/api/join-pow"
register = "/api/hosted/register"

[runtime]
shutdown_seconds = 30

# Shared account identity reads, not another lane's discovery policy.
[identity]
read_http_seconds = 90
retry_seconds = 180
backoff_max_seconds = 900
jitter_seconds = 30

# Each lane owns its mode and policy. Off stops new participation, not safety
# reconciliation of already possibly-sent work. Fresh configuration is read-only.
# Saved mode/model/guidance changes are desired configuration, not admission fences.
# Inspect: agmi lane show answer
# Fence: agmi lane pause answer --expected-control <desired.control_token>
# Resume only that override with a fresh token: agmi lane resume answer --expected-control <token>
# --wait-seconds 30 bounds acquisition (1..=300), not remote settlement or stalled OS I/O.
# Already-started native/remote work can continue; resume grants no retry authority.
# Eligible effects use durable served-in-round fairness, not permanent answer priority.
[capabilities.answer]
mode = "read_only"

[capabilities.answer.model]
harness = "hermes"
executable = "hermes"
model = "gpt-6.1-sol"
reasoning = "high"
# Copy the answer/judge directories beside this config. Active routes require
# nonempty core instructions; user guidance is optional and subordinate.
# Both layers are captured per attempt, hot-reloaded and limited to 64 KiB.
core_guidance_file = "answer/core-guidance.md"
guidance_file = "answer/user-guidance.md"

[capabilities.answer.timeouts]
http_seconds = 90
read_http_seconds = 90 # Independent of the effect deadline; no inheritance.
model_seconds = 300

[capabilities.answer.schedule]
poll_seconds = 120
retry_seconds = 180
backoff_max_seconds = 900
jitter_seconds = 30 # Deterministic staggering; zero disables it.
# Optional discovery-only overrides inherit this lane's retry/base-cap settings.
# discovery_retry_seconds = 30
# discovery_backoff_max_seconds = 120
# Server minima and retained conservative floors always remain binding.

# Optional accepted-job polling, separate from failures and receipt cadence.
# Both positive fields are required; omit the table for normal retry cadence.
# [capabilities.answer.schedule.queued_job_polling]
# initial_seconds = 15
# max_seconds = 120

[capabilities.answer.preparation]
while_blocked = true
retry_uncertain = false # Opt-in can duplicate remote inference charges.
max_attempts_per_work = 2 # Or "unbounded": explicitly authorize paced recurring attempts.
# Replacements for possibly-running same-work inference remain separately bounded.
# max_uncertain_replacements_per_work = 1 # Requires retry_uncertain = true; 0 disables replacements.

# Strict also checks unresolved effects across the account. The capacity cap
# counts this lane's possibly-sent work, not a shared pool or answer reservation.
# Other modes accept conflict risk; elapsed time never proves a request failed.
[capabilities.answer.participation]
mode = "strict" # strict | participation_first | manual
uncertainty_grace_seconds = 300
max_unresolved_operations = 4
# Explicit participation_first + "unbounded" permits distinct fresh work despite
# retained unknowns, without blanket uncertainty grace. It never grants same-work
# replay and can accumulate remote exposure indefinitely. Numeric limits stay finite.
retry_uncertain_answers = false # Separate opt-in; may duplicate an accepted answer.
uncertain_answer_retry_seconds = 600
max_answer_attempts_per_epoch = 2
historical_unknown_answer_capacity = "bounded"
max_historical_unknown_answers = 0
# Participation-first accepted_linked accounting affects answer capacity only.
# It retains original unknowns and accepts accumulating historical uncertainty.

[capabilities.judge]
mode = "read_only"
excluded_assignments = [] # Known assignment transaction IDs; never clears sent work.

# This route can independently select another supported harness/model/reasoning.
[capabilities.judge.model]
harness = "hermes"
executable = "hermes"
model = "gpt-6.1-sol"
reasoning = "high"
core_guidance_file = "judge/core-guidance.md"
guidance_file = "judge/user-guidance.md"
# Admin discovery: agmi config schema; guidance show/set --layer core|user.

[capabilities.judge.timeouts]
http_seconds = 90
read_http_seconds = 90
model_seconds = 300

[capabilities.judge.schedule]
poll_seconds = 120
retry_seconds = 180
backoff_max_seconds = 900
jitter_seconds = 30
# discovery_retry_seconds = 180
# discovery_backoff_max_seconds = 900
# [capabilities.judge.schedule.queued_job_polling]
# initial_seconds = 15
# max_seconds = 120

[capabilities.judge.preparation]
while_blocked = false
retry_uncertain = false
max_attempts_per_work = 2
# max_uncertain_replacements_per_work = 1

[capabilities.judge.participation]
mode = "strict"
uncertainty_grace_seconds = 300
max_unresolved_operations = 4

# Mining is deterministic: no model, harness or preparation configuration.
[capabilities.mine]
mode = "read_only"

[capabilities.mine.timeouts]
http_seconds = 90 # Effectful mine GET uses this deadline, not the read deadline.
read_http_seconds = 90

[capabilities.mine.schedule]
poll_seconds = 120
retry_seconds = 180
backoff_max_seconds = 900
jitter_seconds = 30
interval_seconds = 86400
each_epoch = false # Replaces interval cadence with one dispatched mine per epoch.

[capabilities.mine.participation]
mode = "strict"
uncertainty_grace_seconds = 300
max_unresolved_operations = 4
